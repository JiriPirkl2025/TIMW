profile = "dist"
change-id = 160100

[llvm]
download-ci-llvm = false
link-shared = true
targets = "AMDGPU;X86"

[gcc]
download-ci-gcc = false

[build]
description = "%description%"
target = ["x86_64-unknown-linux-gnu",]
cargo = "/usr/bin/cargo"
rustc = "/usr/bin/rustc"
rustfmt = "/usr/bin/rustfmt"
locked-deps = true
vendor = true
tools = ["cargo", "clippy", "rustfmt", "src",]
profiler = true
sanitizers = false
docs = false

[install]
prefix = "/usr"

[rust]
codegen-units = 1
codegen-units-std = 1
debuginfo-level = 0
debuginfo-level-std = 0
channel = "stable"
rpath = false
frame-pointers = true
lld = false
bootstrap-override-lld = "external"
llvm-bitcode-linker = false
deny-warnings = false
lto = "thin"
parallel-frontend-threads = 0

[dist]
compression-formats = ["gz"]
compression-profile = "fast"

[target.x86_64-unknown-linux-gnu]
llvm-config = "/usr/bin/llvm-config"
optimized-compiler-builtins = "%clangdir%/lib/x86_64-pc-linux-gnu/libclang_rt.builtins.a"
