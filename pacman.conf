[options]
HoldPkg     = pacman glibc
Architecture = auto

Color
VerbosePkgLists
DisableDownloadTimeout
ParallelDownloads = 10
DownloadUser = alpm
DisableSandbox

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[TIMW-AUR]
SigLevel = Never
Server = https://github.com/JiriPirkl2025/TIMW-AUR/releases/download/TIMW-AUR

[core-testing]
Include = /etc/pacman.d/mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra-testing]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
